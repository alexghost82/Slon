# Personal / non-commercial gate CI (CC BY-NC 4.0). Not a commercial-readiness claim.
name: CI

on:
  push:
    branches: [integration/main, main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gates:
    name: pytest + ruff (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-linux.txt
            requirements-dev.txt

      - name: Install system libraries (audio / Qt runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev \
            libasound2-dev \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Linux runtime + developer tools. Prefer OS-specific file over the
          # cross-platform shim so CI matches a real Linux install path.
          python -m pip install -r requirements-linux.txt -r requirements-dev.txt

      - name: Ruff (tests)
        run: python -m ruff check tests

      - name: Pytest gate suites
        env:
          QT_QPA_PLATFORM: offscreen
          # Gate suites must not require live cloud credentials.
          SLON_CI: "1"
        run: >
          python -m pytest -q
          tests/unit
          tests/security
          tests/offline
          tests/integration
